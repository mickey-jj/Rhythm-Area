<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1218" />
    <meta name="description" content="律竞 Rhythm Area · 音游赛事、赛程对阵与成绩记录。" />
    <script>
      try {
        const theme = localStorage.getItem("area-theme");
        document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.readingSize = localStorage.getItem("area-reading-size") === "large" ? "large" : "normal";
      } catch {}
    </script>
    <title>律竞 · Rhythm Area</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
